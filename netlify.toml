# Build configuration for the GNOT public token sale landing page.
# Netlify Next.js Runtime handles SSR/RSC/Server Actions automatically.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Global security headers applied to every response (including static assets,
# which the middleware matcher skips). middleware.ts mirrors these same hard
# headers for matcher routes (defense in depth); keep the two in sync - the
# Permissions-Policy directive list below must match the one in middleware.ts.
# CSP is intentionally NOT defined here - it is generated per-request with a
# nonce by the Next.js middleware (added in Layer 2). Static CSP in a header
# table would be incompatible with nonce-based script policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Versioned media (?v=N cache-busted): the file at a given URL never changes, so cache it
# immutably - repeat visits and re-views never re-fetch or revalidate the videos/posters.
# (Bump ?v= when re-baking an asset, as the scene-video pipeline already does.)
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# State-preview overrides (?phase / ?registration / ?journey + /dev/states) in
# production builds. Active in EVERY context while the site is a staging
# preview so states are reviewable on the shared URL.
# !! REMOVE from [build.environment] before the public launch (pre-launch
# hardening checklist): the live page's phase must not be flippable from a
# crafted link. Preview contexts may keep it via their own context blocks.
[build.environment]
  NEXT_PUBLIC_STATE_OVERRIDES = "1"
  # Newsletter capture UI on (required explicitly in production builds). Stays
  # on at launch (runbook); only STATE_OVERRIDES above must go.
  NEXT_PUBLIC_NEWSLETTER_ENABLED = "1"

# Deploy-context-scoped environment variables.
# Production targets sale.gno.land and Sonar prod + Ethereum mainnet.
# Preview deploys hit Sonar sandbox + Sepolia (set per Netlify dashboard).
[context.production.environment]
  # TEMP: the sale.gno.land custom domain is not attached yet; the prod build is served at
  # gnoland-sonar.netlify.app, so OG image / canonical / og:url / sitemap / JSON-LD must use it
  # or they resolve to a dead sale.gno.land. !! REVERT to "https://sale.gno.land" once the
  # domain is attached (before public launch).
  NEXT_PUBLIC_SITE_URL = "https://gnoland-sonar.netlify.app"

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://deploy-preview.netlify.app"
