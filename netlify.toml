# Build configuration for the GNOT public token sale landing page.
# Netlify Next.js Runtime handles SSR/RSC/Server Actions automatically.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Simple Analytics is served first-party (ad-blocker bypass) by the analytics-proxy edge
# function (netlify/edge-functions/analytics-proxy.ts), NOT a plain proxy rewrite: a rewrite
# would forward the site's session cookie to a third party. The edge function rebuilds the
# outgoing request from a header allowlist so no cookie / IP leaks. The /sgl names avoid SA's
# documented defaults and tracker keywords, out of reach of generic blocklists.

# Global security headers applied to every response (including static assets,
# which the middleware matcher skips). middleware.ts mirrors these same hard
# headers for matcher routes (defense in depth); keep the two in sync - the
# Permissions-Policy directive list below must match the one in middleware.ts.
# CSP is intentionally NOT defined here - it is generated per-request with a
# nonce by the Next.js middleware. Static CSP in a header
# table would be incompatible with nonce-based script policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Versioned media (?v=N cache-busted): the file at a given URL never changes, so cache it
# immutably - repeat visits and re-views never re-fetch or revalidate the videos/posters.
# (Bump ?v= when re-baking an asset, as the scene-video pipeline already does.)
[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Newsletter capture UI on (required explicitly in production builds). Stays on at launch.
[build.environment]
  NEXT_PUBLIC_NEWSLETTER_ENABLED = "1"
  # The web-push VAPID PUBLIC key is client-exposed by design: NEXT_PUBLIC_VAPID_PUBLIC_KEY mirrors
  # VAPID_PUBLIC_KEY and is inlined into the client bundle, so its value legitimately appears in the
  # build output and would otherwise trip Netlify's secret scanner. Exempt only the two PUBLIC keys.
  # SONAR_SALE_UUID is a public identifier (it is in the URL of every user who completes entity
  # setup on Echo) and is server-rendered into the page as the Complete-on-Sonar link.
  # FOOTGUN: never add VAPID_PRIVATE_KEY here - it must stay scanned; if it ever lands in output that
  # is a real leak to fix, not to silence.
  # SALE_CHAIN / NEXT_PUBLIC_SALE_CHAIN are non-secret chain selectors ("mainnet"/"sepolia"); their
  # values legitimately appear in the output, and the launch-day SALE_CHAIN=mainnet set would
  # otherwise fail the deploy on a scanner false-positive.
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY,NEXT_PUBLIC_VAPID_PUBLIC_KEY,SONAR_SALE_UUID,SALE_CHAIN,NEXT_PUBLIC_SALE_CHAIN"

# Deploy-context-scoped environment variables. The SALE_CHAIN pair for EVERY context is versioned
# in this file (production = mainnet, everything else = sepolia); the dashboard only carries
# secrets and the Sonar per-context identifiers.
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://sale.gno.land"

  # Sale chain, client + server pair - ALWAYS identical, versioned here as the single source of
  # truth (netlify.toml wins over the dashboard). Production is the ONLY context on mainnet; the
  # mainnet SettlementSale address lives in code (lib/sale/contracts.ts CONTRACTS map).
  SALE_CHAIN = "mainnet"
  NEXT_PUBLIC_SALE_CHAIN = "mainnet"

  # Fan-out target for the scheduled cron functions (outbid-cron, db-cleanup). Netlify only schedules
  # the PRODUCTION deploy, so the single prod run needs the staging URL to also poke staging's own
  # routes. Under production for that reason (not branch-deploy). Unset -> the staging leg is skipped.
  # Non-secret URL; move it to the Netlify dashboard if you'd rather change it without a redeploy.
  CRON_STAGING_URL = "https://staging--gnoland-sonar.netlify.app"

  # Sale phase is derived purely from the 3 dates in lib/sale/economics.ts (pre-sale -> live ->
  # ended), resolved server-side in app/page.tsx + re-resolved on the clock every 60s. There is no
  # phase override: to place a non-prod deploy in a given phase, override the milestone DATES
  # (see the branch-deploy block below). /dev/states is a mock-fixture gallery, reachable in local
  # dev and on the staging branch-deploy (NEXT_PUBLIC_DEV_STATES_ENABLED below), 404 in production.

  # Tiered contribution bonus surfaces gate. ON in production (enabled per team decision). Goes live
  # at the next production deploy (staging -> main). REMINDER: confirm legal sign-off on the
  # disclaimer (MiCA/US) before that release ships.
  NEXT_PUBLIC_TIERED_BONUS = "1"
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://deploy-preview.netlify.app"
  # Previews stay on Sepolia + sandbox contract, same pair rule as staging below: a non-prod
  # context must never resolve mainnet.
  SALE_CHAIN = "sepolia"
  NEXT_PUBLIC_SALE_CHAIN = "sepolia"

# Branch deploys: the permanent `staging` branch -> a stable test env on Sonar sandbox + Sepolia.
# Same code/bundle as production; ONLY the env differs by context, so promoting staging -> main is
# safe - this block never applies to the production context. Secrets (Sonar sandbox creds, DB,
# ENCRYPTION_KEY / SESSION_PASSWORD / IP_HMAC_PEPPER) are set in the Netlify dashboard scoped to
# Branch deploys, never committed here. Only the non-secret chain + URL config lives below.
[context.branch-deploy.environment]
  # Stable branch URL: https://<branch>--<site>.netlify.app. Confirm/replace if the site name
  # differs, or point it at a custom subdomain (e.g. https://staging.sale.gno.land).
  NEXT_PUBLIC_SITE_URL = "https://staging--gnoland-sonar.netlify.app"
  # Force Sepolia on staging regardless of any dashboard default; the client + server pair MUST
  # match. The prod mainnet contract IS configured in code (lib/sale/contracts.ts), so a non-prod
  # context must never resolve mainnet.
  SALE_CHAIN = "sepolia"
  NEXT_PUBLIC_SALE_CHAIN = "sepolia"
  # Sonar sandbox SettlementSale (redeploy changes it). Overrides the lib/sale/contracts.ts default.
  NEXT_PUBLIC_SEPOLIA_SETTLEMENT_SALE = "0xEffaFDa2A9f8c28958Bf68A7cc0C128D30263208"
  # Sandbox sale's lower minimum commitment (prod keeps the economics.ts default of 100).
  # Match this to your Sonar sandbox sale's actual min.
  NEXT_PUBLIC_MIN_COMMITMENT_USD = "2"
  # Milestone dates mirror the real sale schedule (same as economics.ts defaults) so staging tracks
  # production's phase. Shift these to test other phases (e.g. a recent open to test the live window).
  # Dates shifted to keep staging in the LIVE phase for e2e testing (the sandbox contract is in
  # commitment stage, so on-chain bids work; only these UI-phase dates had lapsed). Revert to mirror
  # prod when done: OPENS 2026-07-20T12:00:00Z, CLOSES per economics.ts. Branch-deploy only - never prod.
  NEXT_PUBLIC_REGISTRATION_OPENS = "2026-07-09T12:00:00Z"
  NEXT_PUBLIC_SALE_OPENS = "2026-07-19T00:00:00Z"
  NEXT_PUBLIC_SALE_CLOSES = "2026-07-24T23:59:00Z"
  # /dev/states gallery (mock fixtures only, no live data): reachable on staging for design review.
  # Never set this in the production context - the page must stay a 404 on sale.gno.land.
  NEXT_PUBLIC_DEV_STATES_ENABLED = "1"
  # Tiered contribution bonus surfaces gate for the branch-deploy context (Sepolia sandbox review):
  # ON here so the team can review on staging. Production stays OFF (see the production block).
  NEXT_PUBLIC_TIERED_BONUS = "1"
