# Test suite: Vitest unit tests and the Playwright wallet-matrix e2e.
# Runs on every pull request and on pushes to main, in parallel with the Checks workflow.
name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pull the repo at the commit under test.
      - uses: actions/checkout@v4

      # Pin Node to the project's runtime and cache npm downloads.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the lockfile.
      - run: npm ci

      # Unit tests under Vitest.
      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      # Pull the repo at the commit under test.
      - uses: actions/checkout@v4

      # Pin Node to the project's runtime and cache npm downloads.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the lockfile.
      - run: npm ci

      # Headless chromium (with its system dependencies) for the wallet-matrix suite.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Wallet-matrix e2e: injected mock EIP-6963 wallets + a local RPC stub against `next dev`
      # in Sonar mock mode. Fully self-contained - playwright.config.ts starts the app and
      # carries the whole environment; no secrets, no preview URL, nothing leaves the runner.
      - name: Wallet e2e
        run: npm run test:e2e

      # The list reporter writes no HTML report; failure evidence lives in test-results/ -
      # per-test traces (retain-on-failure) and error-context snapshots. Open a trace locally
      # with `npx playwright show-trace <trace.zip>`.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
