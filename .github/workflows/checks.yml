# Static checks: lint, typecheck, build, secret scanning, and dependency audit.
# Runs on every pull request and on pushes to main, in parallel with the Tests workflow.
# An e2e job will be added later once a preview URL is available.
name: Checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pull the repo at the commit under test.
      - uses: actions/checkout@v4

      # Pin Node to the project's runtime and cache npm downloads.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the lockfile.
      - run: npm ci

      # Static analysis: Biome lint covers JS/TS/JSON sources.
      - name: Biome lint
        run: npm run lint

      # Scan all committed source for secret patterns (cloud keys, API tokens,
      # private keys). Backstops the local husky pre-commit hook, which a
      # `git commit --no-verify` or a fresh clone without installed hooks would
      # otherwise bypass - so a committed secret is still caught server-side.
      - name: Secret scan (source)
        run: npx secretlint "**/*"

      # TypeScript strict mode - fail on any type error.
      - name: Typecheck
        run: npm run typecheck

      # Produce the production build that the secret scanner inspects.
      - name: Build
        run: npm run build

      # Guard against any server-only secret name leaking into the client bundle.
      - name: Scan bundle for secrets
        run: node scripts/check-secrets.mjs

      # Fail the build on high-or-critical vulnerabilities in PRODUCTION dependencies.
      # Dev/test tooling (e.g. jsdom -> vitest -> undici) is excluded: it never ships to users.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev
