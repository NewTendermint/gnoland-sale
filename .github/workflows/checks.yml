# Static checks: lint, typecheck, build, secret scanning, dependency audit, then dead code.
# Runs on every pull request and on pushes to main, in parallel with the Tests workflow
# (which carries the unit and wallet-e2e jobs).
name: Checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Static analysis: Biome lint covers JS/TS/JSON sources.
      - name: Biome lint
        run: npm run lint

      # Scan all committed source for secret patterns (cloud keys, API tokens,
      # private keys). Backstops the local husky pre-commit hook, which a
      # `git commit --no-verify` or a fresh clone without installed hooks would
      # otherwise bypass - so a committed secret is still caught server-side.
      - name: Secret scan (source)
        run: npx secretlint "**/*"

      # TypeScript strict mode - fail on any type error.
      - name: Typecheck
        run: npm run typecheck

      # Same, for netlify/ (edge functions + scheduled functions). Separate config because those
      # files run outside the Next.js build, on their own platforms - see netlify/tsconfig.json.
      - name: Typecheck (netlify functions)
        run: npm run typecheck:netlify

      # Produce the production build that the secret scanner inspects.
      - name: Build
        run: npm run build

      # Guard against any server-only secret name leaking into the client bundle.
      - name: Scan bundle for secrets
        run: node scripts/check-secrets.mjs

      # Fail on CRITICAL advisories in PRODUCTION dependencies; high is reported, not blocking
      # (rationale + allowlist in the script). Dev/test tooling is excluded: it never ships.
      - name: Audit dependencies
        run: node scripts/audit-check.mjs

      # Unreachable files, unused exports, undeclared/unused dependencies. The allow-list of
      # runtime-only entry points (Netlify functions, service worker, ...) is documented inline in
      # knip.jsonc; anything it reports is genuinely dead and should go.
      # LAST on purpose: this job fails fast, and a hygiene finding must not abort the run before
      # the bundle secret scan and the dependency audit above have produced their signal.
      - name: Dead code
        run: npm run deadcode
